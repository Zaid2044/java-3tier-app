spring:
  application:
    name: employee-portal-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_portal}
    username: ${DB_USERNAME:employee_app}
    password: ${DB_PASSWORD:employee_secret}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.acme.employeeportal: INFO

spring.lifecycle.timeout-per-shutdown-phase: 20s

app:
  demo-data-enabled: ${DEMO_DATA_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: employee-portal
